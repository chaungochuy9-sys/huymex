<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Châu Ngọc Huy | Digital Marketing Portfolio</title>
    <style>
        /* CSS RESET & VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --primary-color: #004d4d; /* Xanh Teal đậm ngành Y tế/Công nghệ */
            --accent-color: #b8860b;  /* Vàng Gold cao cấp */
            --text-dark: #2d3748;
            --text-light: #718096;
            --bg-light: #f7fafc;
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, #002626 100%);
            color: var(--white);
            padding: 90px 20px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .hero p {
            font-size: 1.25rem;
            color: #cbd5e0;
            max-width: 700px;
            margin: 0 auto 25px auto;
        }
        .tagline {
            font-style: italic;
            color: var(--accent-color) !important;
            font-weight: bold;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .section-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 35px;
            position: relative;
            font-size: 2rem;
            text-transform: uppercase;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background-color: var(--accent-color);
            margin: 10px auto 0 auto;
        }

        /* ABOUT ME SECTION */
        .about-box {
            background: var(--white);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            margin-bottom: 50px;
        }
        .about-box p {
            margin-bottom: 15px;
            font-size: 1.05rem;
            color: #4a5568;
            text-align: justify;
        }

        /* TAB FILTER SYSTEM */
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .filter-btn {
            background-color: var(--white);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(0, 77, 77, 0.2);
        }

        /* CASE STUDIES CARDS */
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        .project-card {
            background: var(--white);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-top: 4px solid var(--primary-color);
            display: block; /* Mặc định hiển thị */
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 10px;
        }
        .project-card h3 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }
        .badge {
            background-color: #ebf8fa;
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #bce4eb;
        }
        .project-detail {
            margin-bottom: 18px;
            color: #2d3748;
            font-size: 1.05rem;
        }
        .project-bullet {
            list-style: none;
            margin-left: 5px;
        }
        .project-bullet li {
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #4a5568;
            padding-left: 22px;
            position: relative;
            text-align: justify;
        }
        .project-bullet li::before {
            content: "➔";
            color: var(--accent-color);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

            text-align: center;
            padding: 45px 20px;
            background
